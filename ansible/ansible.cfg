[defaults]
inventory = ./inventory.ini

# Disable host key checking to prevent interactive yes/no confirmation prompts
# during automated unattended provisioning.
# Note: In a hardened production pipeline, host_key_checking should be set to True
# and known_hosts pre-populated via ssh-keyscan.
host_key_checking = False

# Optimization for faster playbook execution
pipelining = True
deprecation_warnings = False
