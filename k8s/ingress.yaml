apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campuscare-ingress
  namespace: campuscare
  labels:
    app.kubernetes.io/name: campuscare
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: campuscare
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: campuscare-backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: campuscare-frontend-service
                port:
                  number: 80
