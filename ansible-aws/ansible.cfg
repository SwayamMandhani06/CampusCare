# ==============================================================================
# CampusCare FA2 — Ansible Configuration
# ==============================================================================

[defaults]
inventory = ./inventory.ini

# Disable interactive SSH host key checking for automated unattended runs
host_key_checking = False

# Enable pipelining for faster SSH execution
pipelining = True

# Silence deprecation warnings for cleaner output
deprecation_warnings = False

# Human-readable stdout callback
stdout_callback = yaml

# Display task execution duration
callbacks_enabled = timer, profile_tasks

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
