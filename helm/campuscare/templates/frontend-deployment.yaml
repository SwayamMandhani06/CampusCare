apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscare-frontend
  namespace: {{ .Values.namespace | default "campuscare" }}
  labels:
    app.kubernetes.io/name: campuscare
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: campuscare
spec:
  replicas: {{ .Values.frontend.replicaCount | default 2 }}
  selector:
    matchLabels:
      app: campuscare-frontend
  template:
    metadata:
      labels:
        app: campuscare-frontend
        app.kubernetes.io/name: campuscare
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: campuscare
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.frontend.service.port | default 80 }}
              name: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.readiness.path | default "/" }}
              port: {{ .Values.frontend.service.port | default 80 }}
            initialDelaySeconds: {{ .Values.frontend.probes.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.frontend.probes.readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.frontend.probes.readiness.failureThreshold | default 3 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.liveness.path | default "/" }}
              port: {{ .Values.frontend.service.port | default 80 }}
            initialDelaySeconds: {{ .Values.frontend.probes.liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds | default 15 }}
            timeoutSeconds: {{ .Values.frontend.probes.liveness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.frontend.probes.liveness.failureThreshold | default 3 }}
