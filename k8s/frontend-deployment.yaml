apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscare-frontend
  namespace: campuscare
  labels:
    app.kubernetes.io/name: campuscare
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: campuscare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campuscare-frontend
  template:
    metadata:
      labels:
        app: campuscare-frontend
        app.kubernetes.io/name: campuscare
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: campuscare
    spec:
      containers:
        - name: frontend
          image: swayammandhani06/campuscare-frontend:manual-test
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
