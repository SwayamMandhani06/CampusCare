# Helm values for Grafana deployment in namespace 'monitoring'
# CampusCare DevOps FA2 - Phase 4C Observability

admin:
  existingSecret: "grafana-admin-secret"
  userKey: "admin-user"
  passwordKey: "admin-password"

service:
  enabled: true
  type: ClusterIP
  port: 80
  targetPort: 3000

persistence:
  type: pvc
  enabled: true
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  finalizers:
    - kubernetes.io/pvc-protection

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: CampusCare Prometheus
        type: prometheus
        uid: campuscare-prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboardsConfigMaps:
  default: "campuscare-grafana-dashboard"

initChownData:
  enabled: false
