{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campuscare-mongodb
  namespace: {{ .Values.namespace | default "campuscare" }}
  labels:
    app.kubernetes.io/name: campuscare
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: campuscare
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: campuscare-mongodb
  template:
    metadata:
      labels:
        app: campuscare-mongodb
        app.kubernetes.io/name: campuscare
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: campuscare
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.mongodb.service.port | default 27017 }}
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: campuscare-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campuscare-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.mongodb.service.port | default 27017 }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.mongodb.service.port | default 27017 }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: campuscare-mongodb-pvc
{{- end }}
