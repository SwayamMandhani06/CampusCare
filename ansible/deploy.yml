---
# ==============================================================================
# CampusCare — Complete GCP VM Configuration & Full-Stack Deployment Playbook
# ==============================================================================
- name: Configure CampusCare VM and Deploy Containerized Stack
  hosts: web
  become: yes

  # ----------------------------------------------------------------------------
  # Variables Definition
  # Note: For production environments, sensitive values (passwords, JWT secrets)
  # should be stored encrypted using `ansible-vault` (e.g. via `vars_files: vault.yml`).
  # For this demonstration deployment, variables are defined directly here for clarity.
  # ----------------------------------------------------------------------------
  vars:
    app_dir: "/home/campuscare/CampusCare"
    app_user: "campuscare"
    vm_public_ip: "34.93.174.126"
    mongo_root_username: "admin"
    mongo_root_password: "campuscare_secure_password_2026"
    jwt_secret: "campuscare_super_secret_jwt_key_2026_devops_fa1"
    backend_port: "5000"

  tasks:
    # --------------------------------------------------------------------------
    # Step 1: System Updates & Prerequisites
    # --------------------------------------------------------------------------
    - name: Update apt cache and upgrade system packages
      apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install required system prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
          - lsb-release
        state: present

    # --------------------------------------------------------------------------
    # Step 2: Docker Engine & Docker Compose Plugin Setup (Official Docker Repo)
    # --------------------------------------------------------------------------
    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download official Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add official Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE and Docker Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    # --------------------------------------------------------------------------
    # Step 3: User Permissions & Docker Service Management
    # --------------------------------------------------------------------------
    - name: Add campuscare user to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes
      # Note: Group membership changes take effect on new SSH login sessions.

    - name: Ensure Docker service is started and enabled on boot
      systemd:
        name: docker
        state: started
        enabled: yes

    # --------------------------------------------------------------------------
    # Step 4: Application Directory & Project Files Transfer
    # --------------------------------------------------------------------------
    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Sync project codebase from control machine to remote VM
      synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_dir }}/"
        delete: no
        recursive: yes
        rsync_opts:
          - "--exclude=node_modules"
          - "--exclude=**/node_modules"
          - "--exclude=dist"
          - "--exclude=**/dist"
          - "--exclude=.env*"
          - "--exclude=.git"
          - "--exclude=terraform"
          - "--exclude=ansible"
          - "--exclude=*.log"
          - "--chown={{ app_user }}:{{ app_user }}"

    - name: Ensure proper ownership of copied application files
      file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: yes

    # --------------------------------------------------------------------------
    # Step 5: Production Environment Variables Configuration
    # --------------------------------------------------------------------------
    - name: Create production .env file on remote VM
      copy:
        dest: "{{ app_dir }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'
        content: |
          # MongoDB Container Credentials
          MONGO_INITDB_ROOT_USERNAME={{ mongo_root_username }}
          MONGO_INITDB_ROOT_PASSWORD={{ mongo_root_password }}

          # Backend API Configuration
          PORT={{ backend_port }}
          JWT_SECRET={{ jwt_secret }}

          # Frontend API Target (Public VM IP)
          # Essential: Frontend bundle sends browser requests to the VM's public IP
          VITE_API_URL=http://{{ vm_public_ip }}:{{ backend_port }}

    # --------------------------------------------------------------------------
    # Step 6: Deploy Stack with Docker Compose
    # --------------------------------------------------------------------------
    - name: Build and launch Docker Compose stack
      command: docker compose up --build -d
      args:
        chdir: "{{ app_dir }}"

    # --------------------------------------------------------------------------
    # Step 7: Health Verification & Database Seeding
    # --------------------------------------------------------------------------
    - name: Wait for Backend API service to respond on port 5000
      wait_for:
        host: 127.0.0.1
        port: "{{ backend_port }}"
        delay: 5
        timeout: 90
        state: started

    - name: Seed database with Administrator, Staff, and demo complaints
      command: docker compose exec -T backend node seed.js
      args:
        chdir: "{{ app_dir }}"
      register: seed_output

    - name: Display database seeding results
      debug:
        var: seed_output.stdout_lines
